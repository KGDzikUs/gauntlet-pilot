name: CI

# `pull_request` jest wymagane przez bramkę CI Gauntleta: manifest wiąże
# wymagany check z konkretnym workflow ORAZ zdarzeniem, a przebieg `push`
# nie zaspokaja wymagania postawionego dla `pull_request`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testy
        run: npm test
